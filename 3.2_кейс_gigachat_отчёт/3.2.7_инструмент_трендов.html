<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Динамика показателя с тренд-линией и выделением выбросов</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #graph-wrap { width: 100%; height: 400px; margin-bottom: 20px; }
        .form-group { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        label { min-width: 100px; text-align: right; }
        select { padding: 5px; border-radius: 4px; border: 1px solid #ccc; }
        button { padding: 5px 10px; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        input[type=file] { padding: 5px; border-radius: 4px; border: 1px solid #ccc; }
        ul { list-style-type: disc; padding-left: 20px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
</head>
<body>
<div class="form-group">
    <label for="csvFile">Выберите файл:</label>
    <input type="file" id="csvFile" accept=".csv"/>
</div>
<div class="form-group">
    <label for="metricSelect">Показатель:</label>
    <select id="metricSelect"></select>
</div>
<div class="form-group">
    <label for="sliceSelect">Срез:</label>
    <select id="sliceSelect"><option value="">Вся выгрузка</option></select>
</div>
<div class="form-group">
    <label for="valueSelect">Значение среза:</label>
    <select id="valueSelect"></select>
</div>
<div id="graph-wrap"></div>
<div id="trend-info" style="margin:8px 0;color:#444"></div>
<div id="outliers-list"></div>
<script>
document.getElementById('csvFile').addEventListener('change', function(event){
    const file = event.target.files[0];
    if (!file || !/\.csv$/i.test(file.name)) return alert("Файл не выбран или неверный тип.");
    
    let reader = new FileReader();
    reader.onload = processCSV;
    reader.readAsText(file);
});

// ПРАВКА: headers и rows нужны обработчикам спискoв и drawChart — глобально
let headers = [], rows = [];

function processCSV(e) {
    const csvData = e.target.result.split("\n").filter(r => r.trim() !== '');
    headers = csvData.shift().replace(/^\ufeff/, '').split(';').map(h => h.trim());
    rows = csvData.map(row => row.split(';').map(c => c.trim()));

    // ПРАВКА: тип колонки определяется по данным, а не по названию:
    // числовая — все значения первой полусотни строк разбираются числом
    const numericCols = [];
    const sliceCols = [];
    headers.forEach((colName, idx) => {
        if (colName === 'месяц') return;
        const sample = rows.slice(0, 50).map(r => r[idx]).filter(v => v !== '');
        const numeric = sample.every(v => !isNaN(parseFloat(v.replace(',', '.'))) &&
                                          isFinite(v.replace(',', '.').replace(/\s/g, '')));
        if (numeric) numericCols.push(idx); else sliceCols.push(colName);
    });
    
    document.getElementById('metricSelect').innerHTML = '';
    numericCols.forEach(idx => {
        const option = document.createElement('option');
        option.value = headers[idx]; 
        option.textContent = headers[idx];
        document.getElementById('metricSelect').appendChild(option);
    });
    
    document.getElementById('sliceSelect').innerHTML = '<option value="">Вся выгрузка</option>';
    sliceCols.forEach(sliceCol => {
        const option = document.createElement('option');
        option.value = sliceCol; 
        option.textContent = sliceCol;
        document.getElementById('sliceSelect').appendChild(option);
    });
    
    updateValueOptions(headers, rows);
    drawChart();
}

function updateValueOptions(headers, rows) {
    const selectedSlice = document.getElementById('sliceSelect').value;
    if (!selectedSlice) {
        document.getElementById('valueSelect').innerHTML = '';
        return;
    }
    
    const uniqueValues = [...new Set(rows.map(row => row[headers.indexOf(selectedSlice)]))];
    document.getElementById('valueSelect').innerHTML = '';
    uniqueValues.sort().forEach(value => {
        const option = document.createElement('option');
        option.value = value; 
        option.textContent = value;
        document.getElementById('valueSelect').appendChild(option);
    });
}

document.getElementById('sliceSelect').onchange = () => {
    // ПРАВКА: после смены среза сразу применяем первое значение и перерисовываем
    updateValueOptions(headers, rows);
    drawChart();
};
document.getElementById('valueSelect').onchange = drawChart;
document.getElementById('metricSelect').onchange = drawChart;

let chartInstance;

function drawChart() {
    if (chartInstance) chartInstance.destroy();
    
    const metric = document.getElementById('metricSelect').value;
    const sliceCol = document.getElementById('sliceSelect').value;
    const sliceVal = document.getElementById('valueSelect').value;
    
    const filteredRows = sliceCol ? rows.filter(row => row[headers.indexOf(sliceCol)] === sliceVal) : rows;
    
    const aggregatedData = {};
    filteredRows.forEach(row => {
        const month = row[0];
        if (!aggregatedData[month]) aggregatedData[month] = [];
        
        const numIndex = headers.findIndex(h => h === metric);
        const val = parseFloat(row[numIndex].replace(',', '.'), 10);
        
        aggregatedData[month].push(val);
    });
    
    const months = Object.keys(aggregatedData).sort();
    const dataPoints = months.map(month => {
        const vals = aggregatedData[month];
        return metric.includes('средн') || metric.includes('ставка') || metric.includes('проц') || metric.includes('доля')
            ? vals.reduce((sum, v) => sum + v, 0) / vals.length
            : vals.reduce((sum, v) => sum + v, 0);
    });
    
    const trendLine = linearRegression(dataPoints);
    const outliers = findOutliers(dataPoints);
    
    // ПРАВКА: контейнер — div; холст создаётся внутри него
    const wrap = document.getElementById('graph-wrap');
    wrap.innerHTML = '<canvas></canvas>';
    const ctx = wrap.querySelector('canvas').getContext('2d');
    chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: months,
            datasets: [
                {
                    label: metric,
                    data: dataPoints,
                    fill: false,
                    pointRadius: 3,
                    pointHitRadius: 10,
                    pointHoverRadius: 6,
                    pointBackgroundColor: dataPoints.map((_, i) => outliers.includes(i) ? 'red' : '#007BFF'),
                    pointBorderWidth: 1,
                    pointBorderColor: '#fff'
                },
                {
                    label: 'Тренд',
                    data: trendLine,
                    fill: false,
                    borderDash: [5, 5],
                    borderColor: 'black',
                    showLine: true
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: {
                    title: { display: true, text: 'Месяцы' }
                },
                y: {
                    beginAtZero: true,
                    title: { display: true, text: metric }
                }
            },
            plugins: {
                legend: { position: 'top' },
                tooltip: {}
            }
        }
    });
    
    renderTrendInfo(trendLine, dataPoints);
    renderOutliers(outliers, dataPoints, months);
}

function linearRegression(values) {
    const n = values.length;
    const xySum = values.reduce((s, v, i) => s + v * i, 0);
    const xSum = values.reduce((s, _, i) => s + i, 0);
    const ySum = values.reduce((s, v) => s + v, 0);
    const xSqSum = values.reduce((s, _, i) => s + Math.pow(i, 2), 0);
    
    const slope = (n * xySum - xSum * ySum) / (n * xSqSum - Math.pow(xSum, 2));
    const intercept = (ySum - slope * xSum) / n;
    
    return Array.from({ length: n }, (_, i) => slope * i + intercept);
}

function findOutliers(values) {
    const sortedVals = values.slice().sort((a, b) => a - b);
    const q1 = getQuantile(sortedVals, 0.25);
    const q3 = getQuantile(sortedVals, 0.75);
    const iqr = q3 - q1;
    const lowerBound = q1 - 1.5 * iqr;
    const upperBound = q3 + 1.5 * iqr;
    
    return values.map((v, i) => v < lowerBound || v > upperBound ? i : null).filter(v => v != null);
}

function getQuantile(arr, p) {
    const pos = arr.length * p;
    const base = Math.floor(pos);
    const rest = pos % 1;
    if (rest > 0) return arr[base] + rest * (arr[base+1]-arr[base]);
    return arr[base];
}

function renderTrendInfo(trendLine, dataPoints) {
    const firstPoint = trendLine[0], lastPoint = trendLine[trendLine.length-1];
    // ПРАВКА: наклон выводился как процент от абсолютного значения;
    // наклон — в единицах показателя за месяц, процент — только у итога за период
    const changePerMonth = ((lastPoint-firstPoint)/(trendLine.length-1)).toFixed(1);
    const totalChange = (((lastPoint-firstPoint)/firstPoint*100)).toFixed(1)+'%';

    // ПРАВКА: селектор указывал на переименованный контейнер
    document.getElementById('trend-info').textContent =
        `Наклон тренда: ${changePerMonth} в месяц, изменение за период: ${totalChange}`;
}

function renderOutliers(outlierIndexes, dataPoints, months) {
    const outlierList = document.getElementById('outliers-list');
    outlierList.innerHTML = '';
    if (outlierIndexes.length == 0) return;
    
    const listEl = document.createElement('ul');
    outlierIndexes.forEach(index => {
        const li = document.createElement('li');
        li.textContent = `${months[index]} (${dataPoints[index].toFixed(2)})`;
        listEl.appendChild(li);
    });
    outlierList.appendChild(listEl);
}
</script>
<canvas id="graph-container"></canvas>
</body>
</html>
