services:
  db:
    image: postgres:16
    container_name: a360_postgres
    environment:
      POSTGRES_DB: bank_training
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_pass
    ports:
      # Слушаем только петлевой интерфейс: учебные логины и пароли не должны
      # оказаться доступны из сети, если стенд поднят не на ноутбуке.
      - "127.0.0.1:5433:5432" # на хосте 5433, чтобы не спорить с локальным Postgres
    volumes:
      - ./sql/init:/docker-entrypoint-initdb.d:ro
      - ./data:/seed:ro
      - a360_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_user -d bank_training"]
      interval: 5s
      timeout: 5s
      retries: 30

  metabase:
    image: metabase/metabase:v0.50.26
    container_name: a360_metabase
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase
      JAVA_TIMEZONE: Europe/Moscow
      MB_ANON_TRACKING_ENABLED: "false"
      # Ограничиваем аппетит виртуальной машины Java: без этого на ноутбуке
      # с 8 ГБ контейнер забирает всё свободное и его убивает система.
      JAVA_OPTS: "-Xmx1024m"
    volumes:
      - a360_mbdata:/metabase-data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40

volumes:
  a360_pgdata:
  a360_mbdata:
